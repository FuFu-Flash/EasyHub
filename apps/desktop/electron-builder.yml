appId: com.easyhub.desktop
productName: EasyHub
directories:
  output: release
  buildResources: resources
files:
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
  - package.json
extraResources:
  - from: ../../THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: resources/licenses
    to: licenses
  - from: ../../LICENSE
    to: LICENSE
  - from: ../../NOTICE
    to: NOTICE
  - from: resources/easyhub.ico
    to: easyhub.ico
  - from: resources/easyhub.png
    to: easyhub.png
  - from: resources/hosts-repair.ps1
    to: hosts-repair.ps1
asar: true
npmRebuild: false
electronLanguages:
  - en-US
  - zh-CN
  - zh-TW
win:
  target:
    - nsis
    - portable
  icon: resources/easyhub.ico
nsis:
  artifactName: EasyHub-${version}-core.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  installerSidebar: resources/installerSidebar.bmp
  uninstallerSidebar: resources/installerSidebar.bmp
  installerHeader: resources/installerHeader.bmp
  include: resources/installer.nsh
portable:
  artifactName: EasyHub-${version}-portable.${ext}
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
