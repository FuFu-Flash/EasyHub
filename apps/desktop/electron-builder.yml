appId: com.easyhub.desktop
productName: EasyHub
directories:
  output: release
  buildResources: resources
files:
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
  - package.json
extraResources:
  - from: ../../THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: resources/licenses
    to: licenses
  - from: ../../LICENSE
    to: LICENSE
  - from: resources/easyhub.ico
    to: easyhub.ico
  - from: resources/easyhub.png
    to: easyhub.png
asar: true
npmRebuild: false
win:
  target:
    - nsis
    - portable
  icon: resources/easyhub.ico
nsis:
  artifactName: EasyHub-${version}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  include: resources/installer.nsh
portable:
  artifactName: EasyHub-${version}-portable.${ext}
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
