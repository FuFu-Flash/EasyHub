appId: com.easyhub.desktop
productName: EasyHub
beforePack: ./scripts/require-compact-build.mjs
directories:
  output: release/windows
  buildResources: resources
files:
  - from: out/windows
    to: out
    filter:
      - main/**/*
      - preload/**/*
      - renderer/**/*
  - package.json
  # JavaScript dependencies are in the release bundles. Preserve the Windows
  # keyring loader and matching native addon instead of a duplicate npm tree.
  - '!node_modules/!(@napi-rs){,/**/*}'
  - '!node_modules/@napi-rs/!(keyring|keyring-win32-x64-msvc){,/**/*}'
  - '!node_modules/**/*.map'
  - '!node_modules/**/*.d.{ts,mts,cts}'
extraResources:
  - from: ../../THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: resources/licenses
    to: licenses
  - from: ../../LICENSE
    to: LICENSE
  - from: ../../NOTICE
    to: NOTICE
  - from: resources/easyhub.ico
    to: easyhub.ico
  - from: resources/easyhub.png
    to: easyhub.png
  - from: resources/hosts-repair.ps1
    to: hosts-repair.ps1
  - from: resources/windows-system-proxy.ps1
    to: windows-system-proxy.ps1
asar: true
npmRebuild: false
electronLanguages:
  - en-US
  - zh-CN
  - zh-TW
win:
  target:
    - nsis
    - portable
  icon: resources/easyhub.ico
nsis:
  artifactName: EasyHub-${version}-core.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  installerSidebar: resources/installerSidebar.bmp
  uninstallerSidebar: resources/installerSidebar.bmp
  installerHeader: resources/installerHeader.bmp
  include: resources/installer.nsh
portable:
  artifactName: EasyHub-${version}-portable.${ext}
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
