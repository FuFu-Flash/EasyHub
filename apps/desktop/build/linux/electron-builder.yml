appId: com.easyhub.desktop
productName: EasyHub
extraMetadata:
  homepage: https://github.com/FuFu-Flash/EasyHub
  desktopName: easyhub.desktop
beforePack: ./scripts/require-linux-compact-build.mjs
directories:
  output: release/linux
  buildResources: resources
files:
  - from: out/linux
    to: out
    filter:
      - main/**/*
      - preload/**/*
      - renderer/**/*
  - package.json
  # JavaScript dependencies are in the release bundles. Preserve the Linux
  # keyring loader and the glibc addon for this build's architecture.
  # package:linux replaces keyring-linux-x64-gnu with the arm64 package on arm64.
  - '!node_modules/!(@napi-rs){,/**/*}'
  - '!node_modules/@napi-rs/!(keyring|keyring-linux-x64-gnu){,/**/*}'
  - '!node_modules/**/*.map'
  - '!node_modules/**/*.d.{ts,mts,cts}'
extraResources:
  - from: ../../THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: resources/licenses
    to: licenses
  - from: ../../LICENSE
    to: LICENSE
  - from: ../../NOTICE
    to: NOTICE
  - from: resources/easyhub.png
    to: easyhub.png
asar: true
asarUnpack:
  - '**/*.node'
npmRebuild: false
electronLanguages:
  - en-US
  - zh-CN
  - zh-TW
linux:
  target:
    - AppImage
    - deb
  executableName: easyhub
  syncDesktopName: true
  icon: resources/easyhub.png
  category: Development
  synopsis: GitHub client for beginners
  maintainer: EasyHub
  # package:linux rewrites x64 to arm64 when building on arm64. Do not use ${arch}:
  # AppImage and deb expand it to x86_64 and amd64.
  artifactName: EasyHub-${version}-x64.${ext}
deb:
  packageName: easyhub
  depends:
    - "libgtk-3-0 | libgtk-3-0t64"
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - "libatspi2.0-0 | libatspi2.0-0t64"
    - libuuid1
    - "libsecret-1-0 | libsecret-1-0t64"
    - "libasound2 | libasound2t64"
