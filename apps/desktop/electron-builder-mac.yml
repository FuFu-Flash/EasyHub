appId: app.easyhub.mac
productName: EasyHub
buildVersion: '18'
extraMetadata:
  version: 1.2.2
directories:
  output: /tmp/easyhub-desktop-release
  buildResources: resources
files:
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
  - package.json
  # JS dependencies are already in the compiled bundles. Preserve the native
  # keyring loader and its matching ARM64 addon, without a duplicate npm tree.
  - '!node_modules/!(@napi-rs){,/**/*}'
  - '!node_modules/@napi-rs/!(keyring|keyring-darwin-arm64){,/**/*}'
  - '!node_modules/**/*.map'
  - '!node_modules/**/*.d.{ts,mts,cts}'
extraResources:
  - from: resources/easyhub.png
    to: easyhub.png
  - from: resources/licenses
    to: licenses
  - from: ../../LICENSE
    to: LICENSE
  - from: ../../NOTICE
    to: NOTICE
  - from: ../../UPSTREAM.txt
    to: UPSTREAM.txt
  - from: ../../THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
asar: true
asarUnpack:
  - '**/*.node'
npmRebuild: false
afterPack: scripts/clean-mac-package-xattrs.cjs
electronDist: node_modules/electron/dist
electronLanguages:
  - en-US
  - zh-CN
  - zh-TW
mac:
  target:
    - target: dir
      arch:
        - arm64
  icon: resources/easyhub.icns
  category: public.app-category.developer-tools
  minimumSystemVersion: '27.0'
  bundleVersion: '18'
  identity: '-'
  hardenedRuntime: false
  notarize: false
  gatekeeperAssess: false
