appId: com.easyhub.desktop.demo
productName: EasyHub Demo
directories:
  output: release/demo
  buildResources: resources
files:
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
  - package.json
extraResources:
  - from: ../../THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: resources/licenses
    to: licenses
  - from: ../../LICENSE
    to: LICENSE
  - from: resources/easyhub.ico
    to: easyhub.ico
  - from: resources/easyhub.png
    to: easyhub.png
asar: true
npmRebuild: false
win:
  target:
    - portable
  icon: resources/easyhub.ico
portable:
  artifactName: EasyHub-${version}-demo.${ext}
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
