<svg xmlns="http://www.w3.org/2000/svg"
     width="512" height="512" viewBox="0 0 160 160" fill="none">
  <title>EasyHub style potted plant - leaves inside pot</title>

  <!-- shadow -->
  <ellipse cx="80" cy="136" rx="36" ry="7" fill="#E8EEF8"/>

  <!-- leaves behind pot, all stems originate inside the pot opening -->
  <g>
    <path d="M78 102
             C67 91 58 78 56 66
             C54 56 57 48 64 45
             C73 42 82 49 85 61
             C89 76 86 92 78 102Z"
          fill="#63BC46"/>
    <path d="M89 103
             C84 89 84 71 89 56
             C94 42 103 34 114 33
             C121 32 125 35 125 41
             C125 55 116 77 102 95
             C98 100 94 102 89 103Z"
          fill="#73C94C"/>
    <path d="M68 104
             C58 96 48 86 40 75
             C34 68 32 61 34 55
             C36 50 41 47 48 49
             C61 53 73 67 77 81
             C79 90 77 97 68 104Z"
          fill="#5DB145"/>

    <!-- stems ending inside pot opening -->
    <path d="M78 108 C78 94 79 80 81 68" stroke="#63B84A" stroke-width="3" stroke-linecap="round"/>
    <path d="M88 108 C88 91 90 75 94 58" stroke="#6BC34B" stroke-width="3" stroke-linecap="round"/>
    <path d="M71 108 C67 96 61 85 53 75" stroke="#58AA43" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- pot opening -->
  <ellipse cx="80" cy="108" rx="24" ry="6.5" fill="#DCE3EF"/>

  <!-- pot body -->
  <path d="M58 109 H102 L96 132
           C95 136 91.5 139 87.3 139 H72.7
           C68.5 139 65 136 64 132 L58 109Z"
        fill="#F5F5F6"/>
  <path d="M56 106.5
           C56 101.8 59.8 98 64.5 98
           H95.5
           C100.2 98 104 101.8 104 106.5
           V110
           H56V106.5Z"
        fill="#FCFCFD"/>
  <path d="M59 122
           C67 124.5 73.5 125.2 80 125.2
           C86.5 125.2 93 124.5 101 122
           L96 132
           C95 136 91.5 139 87.3 139 H72.7
           C68.5 139 65 136 64 132
           L59 122Z"
        fill="#ECECEF"/>

  <!-- right-side inner shade -->
  <path d="M98 99
           C101.5 100.3 104 103.3 104 107.3
           V110
           H102 L96 132
           C95 136 91.5 139 87.3 139 H82
           C87.8 138.2 91.8 134.5 92.9 129.7
           L98 109.2
           V99Z"
        fill="#E8E8EA" opacity="0.9"/>
</svg>
